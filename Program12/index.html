<!DOCTYPE html>
<html>
<head><title>Form Elements</title></head>
<body>
<form>
  <label>Text Box</label>
  <input type="text" id="t1" name="name" value=""/><br><br>
  Radio Button:<br>
  <input type="radio" id="r1" name="gender" value="Male"/>Male<br><br>
  <input type="radio" id="r2" name="gender" value="Female"/>Female<br><br>
  Check Box:<input type="checkbox" id="c1" name="agree" value="yes"/><br><br>
  File:<input type="file" id="e1" name="file"/><br><br>
  Select:<br>
  <label>Sem</label>
  <select name="sem" id="sem"><option value="1">1 Sem</option><option value="2">2 Sem</option></select><br><br>
  Text Area:<br>
  <textarea id="ta1" name="textarea" rows="4" cols="50">At w3schools.com you will learn how to make a website.</textarea><br><br>
  <fieldset>
    <legend>Personal Details:</legend>
    <label>First name:</label><input type="text" id="fname" name="fname"><br><br>
    <label>Last name:</label><input type="text" id="lname" name="lname"><br><br>
  </fieldset><br><br>
  Button:<input type="button" id="t1" value="Submit"/><br>
</form>
</body>
</html>
